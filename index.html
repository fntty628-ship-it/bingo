<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f0">
<title>サイン集めビンゴ</title>
<style>
:root{
  --bg:#fdf6f0;
  --paper:#fffdfb;
  --ink:#5a4a42;
  --muted:#9a8a82;
  --rose:#f3d4d8;
  --rose-deep:#d48f96;
  --rose-ink:#b8656e;
  --gold:#c9a96e;
  --gold-soft:#f1e5cc;
  --sage:#d8e3d4;
  --sky:#dde6ef;
  --line:#ecdcd5;
  --cell:#ffffff;
  --cell-done:#fbe6e9;
  --danger:#c75b5b;
  --shadow:0 2px 12px rgba(120,80,70,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;}
body{min-height:100vh;}
button{font-family:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:10px 12px 40px;}

/* ===== ヘッダー ===== */
header{text-align:center;padding:6px 0 2px;user-select:none;-webkit-user-select:none}
.title{font-size:24px;margin:0;letter-spacing:.1em;font-weight:600;color:var(--rose-ink);
  line-height:1.3;cursor:default;display:inline-block;padding:6px 10px;}
.title small{display:block;font-size:11px;letter-spacing:.3em;color:var(--gold);font-weight:500}
.cardid{margin:2px 0 8px;font-size:13px;color:var(--muted);letter-spacing:.05em}
.cardid b{color:var(--ink);font-size:16px;letter-spacing:.15em;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;
  font-size:13px;min-height:44px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow);cursor:pointer}
.chip.bingo{background:var(--gold-soft);border-color:var(--gold);color:#7a5a1e;font-weight:600}
.progress{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}

/* ===== グリッド ===== */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.cell{position:relative;appearance:none;border:1px solid var(--line);background:var(--cell);border-radius:10px;
  min-height:72px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(120,80,70,.08);transition:transform .08s;}
.cell:active{transform:scale(.96)}
.cell .task{font-size:11px;line-height:1.25;word-break:break-all;line-break:anywhere;overflow-wrap:anywhere;color:var(--ink)}
.cell.done{background:var(--cell-done);border-color:var(--rose)}
.cell.done .task{font-size:9px;color:var(--muted);line-height:1.15}
.cell .name{display:block;margin-top:3px;font-size:12px;font-weight:700;color:var(--rose-ink);word-break:break-all;line-height:1.2}
.cell .mark{position:absolute;top:2px;right:4px;font-size:10px;color:var(--rose-deep)}
.cell.cat-couple{border-color:var(--gold);background:#fffaf0}
.cell.cat-couple.done{background:#f9ecd9}
.cell.cat-know{background:#f7faf6}
.cell.cat-today{background:#f6f8fb}
.cell.cat-know.done,.cell.cat-today.done{background:var(--cell-done)}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l-self::before{background:#fff}
.legend .l-today::before{background:#f6f8fb}
.legend .l-know::before{background:#f7faf6}
.legend .l-couple::before{background:#fffaf0;border-color:var(--gold)}

/* ===== オーバーレイ / モーダル ===== */
.overlay{position:fixed;inset:0;background:rgba(80,50,45,.45);display:none;align-items:center;justify-content:center;
  padding:16px;overflow:auto;z-index:50;-webkit-overflow-scrolling:touch}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:440px;padding:20px 18px;box-shadow:0 10px 40px rgba(60,30,30,.3);
  margin:auto;max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin:0 0 10px;font-size:18px;color:var(--rose-ink);font-weight:600;text-align:center;letter-spacing:.05em}
.modal .task-big{font-size:17px;font-weight:600;text-align:center;background:var(--rose);border-radius:10px;padding:10px;margin-bottom:14px;line-height:1.4}
.modal label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.modal input[type=text],.modal input[type=password]{width:100%;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
.sigwrap{position:relative;border:1px dashed var(--rose-deep);border-radius:10px;background:#fff;overflow:hidden}
.sigwrap canvas{display:block;width:100%;height:170px;touch-action:none}
.sigwrap .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#d9c9c4;font-size:14px;pointer-events:none}
.sigwrap.inked .hint{display:none}
.sigwrap .clear{position:absolute;right:6px;top:6px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;min-height:32px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0 0;text-align:center}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:48px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;padding:10px}
.btn.primary{background:var(--rose-deep);color:#fff}
.btn.secondary{background:#f1e8e4;color:var(--ink)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn.gold{background:var(--gold);color:#fff}
.btn.block{width:100%;flex:none;margin-top:10px}
.sigview{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}
.sigview img{display:block;width:100%;height:auto}
.viewname{text-align:center;font-size:20px;font-weight:700;color:var(--rose-ink);margin:6px 0}
.viewtime{text-align:center;font-size:12px;color:var(--muted)}

/* ===== ルール ===== */
.rules ol{padding-left:22px;margin:0;font-size:15px;line-height:1.7}
.rules li{margin-bottom:6px}
.rules .note{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}

/* ===== BINGO 画面 ===== */
.bingo-screen{position:fixed;inset:0;background:linear-gradient(160deg,#fff4ea 0%,#fbe3e7 55%,#f6e9d2 100%);display:none;z-index:60;overflow:auto;padding:24px 16px 40px}
.bingo-screen.show{display:block}
.bingo-inner{max-width:440px;margin:0 auto;text-align:center}
.bingo-word{font-size:56px;font-weight:800;letter-spacing:.15em;color:var(--rose-ink);margin:10px 0 0;text-shadow:0 3px 0 #fff,0 6px 16px rgba(200,120,130,.35);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.bingo-sub{font-size:14px;color:var(--muted);letter-spacing:.3em}
.bingo-time{font-size:40px;font-weight:700;margin:12px 0 2px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.bingo-meta{font-size:14px;color:var(--muted)}
.bingo-meta b{color:var(--ink);font-size:18px;letter-spacing:.15em}
.bingo-msg{margin:14px 0;font-size:15px;background:#fff;border-radius:12px;padding:12px;box-shadow:var(--shadow);line-height:1.5}
.bingo-msg small{color:var(--rose-ink);font-weight:600;font-size:13px}
/* 達成した瞬間のフラッシュ+紙吹雪 */
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:65;animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:64;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(110vh) rotate(720deg)}}
.bingo-lines{text-align:left}
.bingo-line-title{font-size:13px;color:var(--gold);font-weight:600;margin:14px 0 6px;letter-spacing:.1em}
.sigcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:8px;box-shadow:var(--shadow)}
.sigcard .meta{flex:1;min-width:0}
.sigcard .t{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.2}
.sigcard .n{font-size:15px;font-weight:700;color:var(--rose-ink);word-break:break-all}
.sigcard img{width:120px;height:60px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;flex:none}

/* ===== 幹事メニュー ===== */
.menu .btn{margin-top:10px}
.menu .status{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px}
.pin-input{text-align:center;letter-spacing:.4em;font-size:22px!important}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(80,50,45,.9);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:70;white-space:nowrap}
.toast.show{opacity:1}

@media (min-width:600px){
  .cell{min-height:84px}
  .cell .task{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="title" id="title"><small>WEDDING PARTY</small>サイン集めビンゴ</h1>
    <div class="cardid">カードID <b id="cardId">------</b></div>
    <div class="toolbar">
      <button class="chip" id="btnRules" type="button">📖 ルール</button>
      <button class="chip bingo" id="btnBingoAgain" type="button" style="display:none">🎉 BINGO達成を表示</button>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="grid" id="grid" aria-label="ビンゴカード"></div>
  <div class="legend">
    <span class="l-self">自分のこと</span>
    <span class="l-today">今日の行動</span>
    <span class="l-know">新郎新婦を知ってる</span>
    <span class="l-couple">新郎新婦本人</span>
  </div>
</div>

<!-- サイン入力 -->
<div class="overlay" id="ovSign">
  <div class="modal">
    <h2>サインをもらう</h2>
    <div class="task-big" id="signTask"></div>
    <label for="signName">相手の名前</label>
    <input type="text" id="signName" placeholder="例: 山田 太郎" autocomplete="off" maxlength="30">
    <label>サイン(指で書いてもらう)</label>
    <div class="sigwrap" id="sigwrap">
      <canvas id="sigCanvas"></canvas>
      <div class="hint">ここにサイン</div>
      <button type="button" class="clear" id="sigClear">消す</button>
    </div>
    <div class="err" id="signErr"></div>
    <div class="btnrow">
      <button type="button" class="btn secondary" id="signCancel">やめる</button>
      <button type="button" class="btn primary" id="signSave">保存</button>
    </div>
  </div>
</div>

<!-- サイン表示 -->
<div class="overlay" id="ovView">
  <div class="modal">
    <div class="task-big" id="viewTask"></div>
    <div class="viewname" id="viewName"></div>
    <div class="sigview"><img id="viewImg" alt="サイン"></div>
    <div class="viewtime" id="viewTime"></div>
    <div class="btnrow">
      <button type="button" class="btn danger" id="viewDelete">取り消す</button>
      <button type="button" class="btn primary" id="viewClose">閉じる</button>
    </div>
  </div>
</div>

<!-- ルール -->
<div class="overlay" id="ovRules">
  <div class="modal rules">
    <h2>あそびかた</h2>
    <ol id="rulesList"></ol>
    <div class="note" id="rulesNote"></div>
    <button type="button" class="btn primary block" id="rulesOk">はじめる</button>
  </div>
</div>

<!-- 暗証番号 -->
<div class="overlay" id="ovPin">
  <div class="modal">
    <h2>幹事メニュー</h2>
    <label for="pinInput">暗証番号</label>
    <input type="password" id="pinInput" class="pin-input" inputmode="numeric" autocomplete="off" maxlength="8">
    <div class="err" id="pinErr"></div>
    <div class="btnrow">
      <button type="button" class="btn secondary" id="pinCancel">やめる</button>
      <button type="button" class="btn primary" id="pinOk">OK</button>
    </div>
  </div>
</div>

<!-- 幹事メニュー -->
<div class="overlay" id="ovMenu">
  <div class="modal menu">
    <h2>幹事メニュー</h2>
    <div class="status" id="menuStatus"></div>
    <button type="button" class="btn gold block" id="menuRegen">🔄 カードを作り直す</button>
    <button type="button" class="btn secondary block" id="menuWin">勝利条件を切り替える</button>
    <button type="button" class="btn danger block" id="menuWipe">🗑 全データ削除</button>
    <button type="button" class="btn secondary block" id="menuClose">閉じる</button>
  </div>
</div>

<!-- 確認 -->
<div class="overlay" id="ovConfirm">
  <div class="modal">
    <h2 id="confirmTitle">確認</h2>
    <div id="confirmMsg" style="text-align:center;font-size:15px;line-height:1.6"></div>
    <div class="btnrow">
      <button type="button" class="btn secondary" id="confirmNo">やめる</button>
      <button type="button" class="btn primary" id="confirmYes">OK</button>
    </div>
  </div>
</div>

<!-- BINGO -->
<div class="bingo-screen" id="bingoScreen">
  <div class="bingo-inner">
    <div class="bingo-sub">CONGRATULATIONS</div>
    <div class="bingo-word">BINGO!</div>
    <div class="bingo-time" id="bingoTime">--:--:--</div>
    <div class="bingo-meta">達成時刻 ／ カードID <b id="bingoCardId">------</b></div>
    <div class="bingo-msg">集計のときにこの画面を司会に見せてください 🎤<br><small>達成時刻が早い人から順に景品！</small></div>
    <div class="bingo-lines" id="bingoLines"></div>
    <button type="button" class="btn secondary block" id="bingoClose">カードに戻る</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* =====================================================================
 *  ★ ここから設定(お題・暗証番号など)。編集するのは基本ここだけ ★
 * ===================================================================== */

// 幹事メニューの暗証番号(タイトルを5回連続タップで入力画面が出ます)
const ORGANIZER_PIN = "2026";

// 勝利条件の初期値: 1 = 1列そろったらBINGO / 2 = 2列そろったらBINGO
// (幹事メニューでも切り替えできますが、それはその端末だけに効きます)
const DEFAULT_WIN_LINES = 1;

// お題プール。各系統から count 個ずつランダムに選んで25マスにします(合計25になるように)。
const POOLS = [
  { key:"self",  label:"自分のこと", count:15, items:[
    "県外から来た",
    "群馬県民",
    "既婚者",
    "子どもがいる",
    "左利き",
    "ペットを飼っている",
    "兄弟が3人以上",
    "海外に行ったことがある",
    "血液型が自分と同じ",
    "誕生月が自分と同じ",
    "お酒が飲めない",
    "高専卒",
    "理系",
    "文系",
    "iPhone派",
    "Android派",
    "朝ごはんを食べてきた",
    "楽器ができる",
    "スポーツを今も続けている",
    "最近1年で引っ越した",
    "車で来た",
    "新幹線で来た",
    "靴のサイズが自分と同じ",
    "名字のイニシャルが自分と同じ",
  ]},
  { key:"today", label:"今日の行動", count:5, items:[
    "今日初めて会った人",
    "結婚式本番にも出席した",
    "今日写真を10枚以上撮った",
    "今日初めて高崎に来た",
    "今日新郎新婦と写真を撮った",
    "今日ケーキ(デザート)を食べた",
  ]},
  { key:"know", label:"新郎新婦を知っている", count:4, items:[
    "新郎と同じ高専",
    "新婦と同級生",
    "新郎新婦と同じ職場",
    "新郎新婦の出会った場所を知っている",
    "新婦の旧姓を漢字で書ける",
    "プロポーズの場所を知っている",
    "新郎新婦の家に行ったことがある",
    "新郎新婦と旅行したことがある",
    "自分と反対側(新郎側⇄新婦側)のゲスト",
  ]},
  { key:"couple", label:"新郎新婦本人サイン", count:1, items:[
    "新郎本人",
    "新婦本人",
    "新郎に「おめでとう」と言ってサインをもらう",
    "新婦にドレスの感想を伝えてサインをもらう",
  ]},
];

// ルール説明(初回と「ルール」ボタンで表示)
const RULES = [
  "マスのお題に該当する人を探して、名前とサインをもらう",
  "同じ人からもらえるのは1マスまで",
  "縦・横・斜めのどれか1列そろったらBINGO！ 達成した時刻が記録されます",
  "乾杯から1時間後に集計。達成時刻が早い人から順に前へ出て景品をもらってね",
];

// ルール画面の下に出す補足(1行)
const RULES_NOTE = "カードは人それぞれ違います。閉じても同じブラウザで開けば同じカードが出ます(LINEのQRリーダーではなく、スマホ標準のカメラで読んでね)";

/* =====================================================================
 *  ここから下はプログラム本体
 * ===================================================================== */

const LS = {
  seed:"sbingo.seed", cells:"sbingo.cells", bingo:"sbingo.bingo",
  win:"sbingo.winLines", rules:"sbingo.rulesSeen",
};

const $ = (id)=>document.getElementById(id);

// ---------- 乱数(seed固定) ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function newSeed(){
  if(window.crypto && crypto.getRandomValues){
    const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] >>> 0;
  }
  return Math.floor(Math.random()*4294967296) >>> 0;
}
function cardIdOf(seed){
  // seedを撹拌して6桁に
  const r = mulberry32(seed ^ 0x9E3779B9);
  return String(Math.floor(r()*1000000)).padStart(6,"0");
}

// ---------- カード生成 ----------
function buildCard(seed){
  const rng = mulberry32(seed);
  let total = 0;
  for(const p of POOLS){
    total += p.count;
    if(p.items.length < p.count){
      throw new Error(`お題「${p.label}」が不足しています(${p.items.length}個、必要${p.count}個)`);
    }
  }
  if(total !== 25) throw new Error(`お題の合計が25ではありません(${total})`);
  let items = [];
  for(const p of POOLS){
    const picked = shuffle(p.items.slice(), rng).slice(0, p.count);
    items.push(...picked.map(t=>({text:t, cat:p.key})));
  }
  return shuffle(items, rng);
}

// ---------- ストレージ ----------
function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast("保存できませんでした(容量不足?)"); return false; }
}
function remove(key){ try{ localStorage.removeItem(key); }catch(e){} }

// ---------- 判定 ----------
const LINES = (()=>{
  const L = [];
  for(let r=0;r<5;r++) L.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) L.push([0,1,2,3,4].map(r=>r*5+c));
  L.push([0,6,12,18,24]);
  L.push([4,8,12,16,20]);
  return L;
})();
function lineName(idx){
  if(idx<5) return `横 ${idx+1}行目`;
  if(idx<10) return `縦 ${idx-5+1}列目`;
  return idx===10 ? "斜め(左上→右下)" : "斜め(右上→左下)";
}
function completedLineIdx(cells){
  const out = [];
  LINES.forEach((l,i)=>{ if(l.every(k=>cells[k])) out.push(i); });
  return out;
}

// ---------- 名前の正規化 ----------
function normName(s){
  return (s||"").normalize("NFKC").replace(/[\s　]+/g,"").toLowerCase();
}

// ---------- 状態 ----------
const state = { seed:null, card:[], cells:{}, bingo:null, winLines:DEFAULT_WIN_LINES };

function init(){
  let seed = load(LS.seed, null);
  if(typeof seed !== "number"){ seed = newSeed(); save(LS.seed, seed); }
  state.seed = seed;
  state.card = buildCard(seed);
  state.cells = load(LS.cells, {}) || {};
  state.bingo = load(LS.bingo, null);
  const w = load(LS.win, null);
  state.winLines = (w===1||w===2) ? w : DEFAULT_WIN_LINES;
  // 保存データの整合(マス数が変わった等)
  for(const k of Object.keys(state.cells)){
    const i = +k;
    if(!(i>=0 && i<25) || !state.cells[k] || !state.cells[k].name) delete state.cells[k];
  }
  renderAll();
  if(!load(LS.rules, false)) openRules(true);
}

// ---------- 描画 ----------
function renderAll(){
  $("cardId").textContent = cardIdOf(state.seed);
  renderGrid();
  renderHeader();
}
function renderGrid(){
  const g = $("grid");
  g.innerHTML = "";
  state.card.forEach((item, i)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell cat-" + item.cat;
    const c = state.cells[i];
    if(c){
      b.classList.add("done");
      b.innerHTML = `<span class="mark">✓</span><span class="task"></span><span class="name"></span>`;
      b.querySelector(".task").textContent = item.text;
      b.querySelector(".name").textContent = c.name;
      b.setAttribute("aria-label", `${item.text} ${c.name} サイン済み`);
    }else{
      b.innerHTML = `<span class="task"></span>`;
      b.querySelector(".task").textContent = item.text;
      b.setAttribute("aria-label", item.text);
    }
    b.addEventListener("click", ()=> state.cells[i] ? openView(i) : openSign(i));
    g.appendChild(b);
  });
}
function renderHeader(){
  const n = Object.keys(state.cells).length;
  const lines = completedLineIdx(state.cells).length;
  $("progress").textContent = `サイン ${n} / 25　そろった列 ${lines}　(${state.winLines}列でBINGO)`;
  $("btnBingoAgain").style.display = state.bingo ? "" : "none";
}

// ---------- オーバーレイ共通 ----------
function show(id){ $(id).classList.add("show"); }
function hide(id){ $(id).classList.remove("show"); }
let toastTimer = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function confirmDialog(title, msg, onYes){
  $("confirmTitle").textContent = title;
  $("confirmMsg").textContent = msg;
  show("ovConfirm");
  const yes = $("confirmYes"), no = $("confirmNo");
  const cleanup = ()=>{ hide("ovConfirm"); yes.onclick = null; no.onclick = null; };
  yes.onclick = ()=>{ cleanup(); onYes(); };
  no.onclick = cleanup;
}

// ---------- サインパッド ----------
const pad = (()=>{
  const canvas = $("sigCanvas");
  const wrap = $("sigwrap");
  const ctx = canvas.getContext("2d");
  let drawing = false, inked = false, last = null;
  function resize(){
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#2b2b3a";
    clear();
  }
  function clear(){
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore();
    inked = false; wrap.classList.remove("inked");
  }
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function down(e){
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    drawing = true; last = pos(e);
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    // 点を打つ(タップだけでも描けるように)
    ctx.beginPath(); ctx.arc(last.x,last.y,1.3,0,Math.PI*2); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
    inked = true; wrap.classList.add("inked");
  }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p;
  }
  function up(e){ drawing = false; last = null; }
  canvas.addEventListener("pointerdown", down);
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("pointerleave", up);
  $("sigClear").addEventListener("click", clear);
  function toPNG(){
    // CSSサイズで書き出してデータ量を抑える
    const out = document.createElement("canvas");
    out.width = canvas.clientWidth; out.height = canvas.clientHeight;
    const c2 = out.getContext("2d");
    c2.fillStyle = "#fff"; c2.fillRect(0,0,out.width,out.height);
    c2.drawImage(canvas,0,0,out.width,out.height);
    return out.toDataURL("image/png");
  }
  return { resize, clear, toPNG, hasInk:()=>inked };
})();

// ---------- サイン入力 ----------
let signIndex = -1;
function openSign(i){
  signIndex = i;
  $("signTask").textContent = state.card[i].text;
  $("signName").value = "";
  $("signErr").textContent = "";
  show("ovSign");
  pad.resize(); // 表示直後に同期でサイズ合わせ(後から走ると描いた線が消えるため)
}
function closeSign(){ hide("ovSign"); signIndex = -1; }
$("signCancel").addEventListener("click", closeSign);
$("signSave").addEventListener("click", ()=>{
  const name = $("signName").value.trim();
  const err = $("signErr");
  if(!name){ err.textContent = "相手の名前を入力してください"; return; }
  if(!pad.hasInk()){ err.textContent = "サインを書いてもらってください"; return; }
  const key = normName(name);
  for(const k of Object.keys(state.cells)){
    if(+k === signIndex) continue;
    if(normName(state.cells[k].name) === key){
      err.textContent = `「${state.cells[k].name}」さんは別のマスにいます。同じ人は1マスまで！`;
      return;
    }
  }
  const entry = { name, sig: pad.toPNG(), at: new Date().toISOString() };
  const prev = state.cells[signIndex];
  state.cells[signIndex] = entry;
  if(!save(LS.cells, state.cells)){ if(prev) state.cells[signIndex]=prev; else delete state.cells[signIndex]; return; }
  closeSign();
  renderGrid(); renderHeader();
  checkBingo(true);
});
$("ovSign").addEventListener("click", (e)=>{ if(e.target.id==="ovSign") closeSign(); });

// ---------- サイン表示 / 取り消し ----------
let viewIndex = -1;
function openView(i){
  viewIndex = i;
  const c = state.cells[i];
  $("viewTask").textContent = state.card[i].text;
  $("viewName").textContent = c.name;
  $("viewImg").src = c.sig;
  $("viewTime").textContent = c.at ? "記録 " + fmtTime(c.at) : "";
  show("ovView");
}
$("viewClose").addEventListener("click", ()=>hide("ovView"));
$("ovView").addEventListener("click", (e)=>{ if(e.target.id==="ovView") hide("ovView"); });
$("viewDelete").addEventListener("click", ()=>{
  const i = viewIndex;
  confirmDialog("取り消し", `「${state.cells[i].name}」さんのサインを取り消しますか？`, ()=>{
    delete state.cells[i];
    save(LS.cells, state.cells);
    hide("ovView");
    renderGrid(); renderHeader();
    checkBingo(false);
    toast("取り消しました");
  });
});

// ---------- BINGO ----------
function fmtTime(iso){
  const d = new Date(iso);
  const p = (n)=>String(n).padStart(2,"0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function checkBingo(announce){
  const done = completedLineIdx(state.cells);
  if(done.length >= state.winLines){
    if(!state.bingo){
      state.bingo = { at: new Date().toISOString(), lines: done.slice(0, state.winLines) };
      save(LS.bingo, state.bingo);
      renderHeader();
      showBingo();
      celebrate();
    }else if(announce){
      // 既に達成済みなら記録はそのまま(最初の達成時刻を守る)
    }
  }else if(state.bingo){
    // 取り消しや勝利条件変更で条件を満たさなくなった
    state.bingo = null; remove(LS.bingo); renderHeader();
    toast("BINGOの記録を取り消しました");
  }
}
function showBingo(){
  const b = state.bingo; if(!b) return;
  $("bingoTime").textContent = fmtTime(b.at);
  $("bingoCardId").textContent = cardIdOf(state.seed);
  const box = $("bingoLines"); box.innerHTML = "";
  const lines = (b.lines && b.lines.length) ? b.lines : completedLineIdx(state.cells).slice(0, state.winLines);
  lines.forEach((li)=>{
    const h = document.createElement("div"); h.className = "bingo-line-title"; h.textContent = "◆ " + lineName(li); box.appendChild(h);
    LINES[li].forEach((k)=>{
      const c = state.cells[k]; if(!c) return;
      const card = document.createElement("div"); card.className = "sigcard";
      card.innerHTML = `<div class="meta"><div class="t"></div><div class="n"></div></div><img alt="サイン">`;
      card.querySelector(".t").textContent = state.card[k].text;
      card.querySelector(".n").textContent = c.name;
      card.querySelector("img").src = c.sig;
      box.appendChild(card);
    });
  });
  show("bingoScreen");
  window.scrollTo(0,0);
}
// 達成した瞬間だけ: 白フラッシュ + 紙吹雪(再表示のときは出さない)
function celebrate(){
  const flash = document.createElement("div"); flash.className = "flash";
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 1200);
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#e8b4b8","#d48f96","#c9a96e","#f1e5cc","#b9cbb6","#dde6ef","#fff"];
  for(let i=0;i<70;i++){
    const p = document.createElement("i");
    p.style.left = (Math.random()*100) + "%";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (2.2 + Math.random()*1.8) + "s";
    p.style.animationDelay = (Math.random()*0.8) + "s";
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 5000);
  if(navigator.vibrate){ try{ navigator.vibrate([120,60,120]); }catch(_){} }
}
$("bingoClose").addEventListener("click", ()=>hide("bingoScreen"));
$("btnBingoAgain").addEventListener("click", showBingo);

// ---------- ルール ----------
function openRules(first){
  const ol = $("rulesList"); ol.innerHTML = "";
  RULES.forEach(t=>{ const li = document.createElement("li"); li.textContent = t.replace("1列", state.winLines + "列"); ol.appendChild(li); });
  $("rulesNote").textContent = RULES_NOTE;
  $("rulesOk").textContent = first ? "はじめる" : "閉じる";
  show("ovRules");
}
$("rulesOk").addEventListener("click", ()=>{ save(LS.rules, true); hide("ovRules"); });
$("btnRules").addEventListener("click", ()=>openRules(false));

// ---------- 幹事メニュー(タイトル5回タップ) ----------
let tapCount = 0, tapTimer = null;
$("title").addEventListener("click", ()=>{
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount = 0; }, 1500);
  if(tapCount >= 5){ tapCount = 0; openPin(); }
});
function openPin(){
  $("pinInput").value = ""; $("pinErr").textContent = "";
  show("ovPin");
  setTimeout(()=>$("pinInput").focus(), 50);
}
$("pinCancel").addEventListener("click", ()=>hide("ovPin"));
$("pinOk").addEventListener("click", checkPin);
$("pinInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") checkPin(); });
function checkPin(){
  if($("pinInput").value === ORGANIZER_PIN){ hide("ovPin"); openMenu(); }
  else { $("pinErr").textContent = "暗証番号が違います"; $("pinInput").value = ""; }
}
function openMenu(){
  $("menuStatus").textContent = `カードID ${cardIdOf(state.seed)} ／ 現在の勝利条件: ${state.winLines}列`;
  $("menuWin").textContent = `勝利条件を ${state.winLines===1?2:1}列 に切り替える`;
  show("ovMenu");
}
$("menuClose").addEventListener("click", ()=>hide("ovMenu"));
$("menuRegen").addEventListener("click", ()=>{
  confirmDialog("カードを作り直す", "お題を新しく配り直します。保存済みのサインはすべて消えます。よろしいですか？", ()=>{
    state.seed = newSeed(); save(LS.seed, state.seed);
    state.card = buildCard(state.seed);
    state.cells = {}; remove(LS.cells);
    state.bingo = null; remove(LS.bingo);
    hide("ovMenu"); renderAll(); toast("新しいカードにしました");
  });
});
$("menuWin").addEventListener("click", ()=>{
  state.winLines = state.winLines===1 ? 2 : 1;
  save(LS.win, state.winLines);
  renderHeader(); openMenu();
  checkBingo(false);
  toast(`勝利条件: ${state.winLines}列`);
});
$("menuWipe").addEventListener("click", ()=>{
  confirmDialog("全データ削除", "カード・サイン・設定をすべて削除して最初の状態に戻します。よろしいですか？", ()=>{
    Object.values(LS).forEach(remove);
    location.reload();
  });
});

// ---------- 起動 ----------
try{ init(); }
catch(e){
  document.body.innerHTML = `<div style="padding:24px;color:#c75b5b;font-size:15px">設定エラー: ${String(e.message||e)}</div>`;
  console.error(e);
}
})();
</script>
</body>
</html>
